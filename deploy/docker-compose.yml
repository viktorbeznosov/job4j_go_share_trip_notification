services:
  postgres:
    image: postgres:16
    container_name: pg_notification
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: share_trip_notification
    ports:
      - "6544:5432"
    volumes:
      - pgdata_notification:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata_notification: